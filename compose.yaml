name: homeagent
services:
  server:
    build:
      context: .
      target: relay
    image: homeagent-relay:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3210
      HOMEAGENT_DB: /app/data/server.sqlite
    ports:
      - "127.0.0.1:${PORT:-3210}:3210"
    volumes:
      - server-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
  caddy:
    image: caddy:2.11.7-alpine
    profiles: [proxy]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    profiles: [cloudflare]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      server:
        condition: service_healthy
volumes:
  server-data:
  caddy-data:
  caddy-config:

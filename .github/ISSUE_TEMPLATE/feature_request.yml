name: Feature request
description: Describe a remote development workflow that needs improvement.
title: "[Feature] "
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and problem
      description: Explain the task and where the current tools fall short.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Include platform needs, authorization boundaries and expected results.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

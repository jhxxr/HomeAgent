name: verify
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify when called by the release workflow.
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Select Python executable
        run: python -c "import os,sys; f=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8'); f.write('HOMEAGENT_TEST_PYTHON='+sys.executable+'\n'); f.close()"
      - run: npm ci
      - run: npm run verify
      - run: npm run notices:check
      - run: npm audit --omit=dev --audit-level=high
  docker:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: node scripts/init.mjs
      - run: docker compose build server
      - run: docker build --target runner -t homeagent-runner-test .
      - name: Verify Compose startup
        run: |
          docker compose config --quiet
          docker compose up -d --no-build --wait --wait-timeout 120
          curl --fail http://localhost:3210/health
          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3210/mcp)"
          test "$status" = 401
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.3.0 or v0.4.0-rc.1.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      server_package_name: ${{ steps.metadata.outputs.server_package_name }}
      runner_package_name: ${{ steps.metadata.outputs.runner_package_name }}
      npm_tag: ${{ steps.metadata.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Validate tag, commit, version and changelog
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-metadata.mjs

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
    permissions:
      contents: read

  package:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run notices:check
      - run: npm run release:check
      - run: npm run release:source
      - run: npm run release:npm
      - name: Generate version-specific release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release-metadata.mjs --notes
      - name: Verify archive checksum
        working-directory: release
        run: sha256sum --check *.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # Publish only the verified tarball. No checkout, npm install or lifecycle scripts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org/
      - name: Check verified npm artifact and immutable version
        id: npm
        env:
          EXPECTED_SERVER_NAME: ${{ needs.prepare.outputs.server_package_name }}
          EXPECTED_RUNNER_NAME: ${{ needs.prepare.outputs.runner_package_name }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.npm_tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          metadata=release/npm-packages.json
          test "$(jq -r '.version' "$metadata")" = "$EXPECTED_VERSION"
          test "$(jq -r '.commit' "$metadata")" = "$EXPECTED_COMMIT"
          test "$(jq -r '.packages | length' "$metadata")" = 2
          server_archive="$(jq -r --arg name "$EXPECTED_SERVER_NAME" '.packages[] | select(.name == $name) | .filename' "$metadata")"
          runner_archive="$(jq -r --arg name "$EXPECTED_RUNNER_NAME" '.packages[] | select(.name == $name) | .filename' "$metadata")"
          for archive in "$server_archive" "$runner_archive"; do
            [[ "$archive" =~ ^[a-z0-9][a-z0-9._-]*\.tgz$ ]]
            (cd release && sha256sum --check "${archive}.sha256")
          done
          echo "server_archive=$server_archive" >> "$GITHUB_OUTPUT"
          echo "runner_archive=$runner_archive" >> "$GITHUB_OUTPUT"
          for package_name in "$EXPECTED_SERVER_NAME" "$EXPECTED_RUNNER_NAME"; do
            test "$(jq -r --arg name "$package_name" '.packages[] | select(.name == $name) | .distTag' "$metadata")" = "$EXPECTED_TAG"
          done
          object="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object')"
          for depth in 1 2 3 4 5; do
            type="$(jq -r '.type' <<<"$object")"
            sha="$(jq -r '.sha' <<<"$object")"
            if [ "$type" = commit ]; then break; fi
            test "$type" = tag
            object="$(gh api "repos/${GH_REPO}/git/tags/${sha}" --jq '.object')"
          done
          test "$type" = commit
          test "$sha" = "$EXPECTED_COMMIT"
          # A network/registry error is not proof that a version is available.
          for package_name in "$EXPECTED_SERVER_NAME" "$EXPECTED_RUNNER_NAME"; do
            status="$(curl -sS -o "registry-${package_name}.json" -w '%{http_code}' \
              "https://registry.npmjs.org/${package_name}/${EXPECTED_VERSION}")"
            if [ "$status" = 200 ]; then
              test "$(jq -r '.dist.integrity' "registry-${package_name}.json")" = "$(jq -r --arg name "$package_name" '.packages[] | select(.name == $name) | .integrity' "$metadata")"
              if [ "$package_name" = "$EXPECTED_SERVER_NAME" ]; then
                echo "server_already=true" >> "$GITHUB_OUTPUT"
              else
                echo "runner_already=true" >> "$GITHUB_OUTPUT"
              fi
              echo "The exact verified ${package_name} package already exists; resuming GitHub Release."
            else
              test "$status" = 404
              if [ "$package_name" = "$EXPECTED_SERVER_NAME" ]; then
                echo "server_already=false" >> "$GITHUB_OUTPUT"
              else
                echo "runner_already=false" >> "$GITHUB_OUTPUT"
              fi
            fi
          done
      - name: Publish public npm package with repository secret
        if: (steps.npm.outputs.server_already != 'true' || steps.npm.outputs.runner_already != 'true') && vars.NPM_AUTH_MODE != 'oidc'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SERVER_ARCHIVE: ${{ steps.npm.outputs.server_archive }}
          RUNNER_ARCHIVE: ${{ steps.npm.outputs.runner_archive }}
          SERVER_ALREADY: ${{ steps.npm.outputs.server_already }}
          RUNNER_ALREADY: ${{ steps.npm.outputs.runner_already }}
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Add the NPM_TOKEN Actions secret, or configure trusted publishing and NPM_AUTH_MODE=oidc."
            exit 1
          fi
          if [ "$SERVER_ALREADY" != true ]; then
            npm publish "./release/${SERVER_ARCHIVE}" --ignore-scripts --access public \
              --tag "$NPM_TAG" --registry https://registry.npmjs.org/
          fi
          if [ "$RUNNER_ALREADY" != true ]; then
            npm publish "./release/${RUNNER_ARCHIVE}" --ignore-scripts --access public \
              --tag "$NPM_TAG" --registry https://registry.npmjs.org/
          fi
      - name: Publish with npm trusted publishing
        if: (steps.npm.outputs.server_already != 'true' || steps.npm.outputs.runner_already != 'true') && vars.NPM_AUTH_MODE == 'oidc'
        env:
          SERVER_ARCHIVE: ${{ steps.npm.outputs.server_archive }}
          RUNNER_ARCHIVE: ${{ steps.npm.outputs.runner_archive }}
          SERVER_ALREADY: ${{ steps.npm.outputs.server_already }}
          RUNNER_ALREADY: ${{ steps.npm.outputs.runner_already }}
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Remove setup-node's token configuration so npm can use GitHub OIDC.
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-oidc.npmrc"
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          if [ "$SERVER_ALREADY" != true ]; then
            npm publish "./release/${SERVER_ARCHIVE}" --ignore-scripts --access public \
              --provenance --tag "$NPM_TAG" --registry https://registry.npmjs.org/
          fi
          if [ "$RUNNER_ALREADY" != true ]; then
            npm publish "./release/${RUNNER_ARCHIVE}" --ignore-scripts --access public \
              --provenance --tag "$NPM_TAG" --registry https://registry.npmjs.org/
          fi

  publish:
    needs: [prepare, package, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      # No checkout, dependency installation or project code runs with the write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: release
      - name: Publish reviewed assets through a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          asset="HomeAgent-v${RELEASE_VERSION}-source"
          test -f "release/${asset}.tar.gz"
          test -f "release/${asset}.tar.gz.sha256"
          test -f "release/${asset}.manifest.txt"
          test -f release/RELEASE_NOTES.md
          server_archive="$(jq -r '.packages[] | select(.name == "homeagent-server") | .filename' release/npm-packages.json)"
          runner_archive="$(jq -r '.packages[] | select(.name == "homeagent-runner") | .filename' release/npm-packages.json)"
          for archive in "$server_archive" "$runner_archive"; do
            [[ "$archive" =~ ^[a-z0-9][a-z0-9._-]*\.tgz$ ]]
            test -f "release/${archive}.sha256"
            (cd release && sha256sum --check "${archive}.sha256")
          done
          (cd release && sha256sum --check "${asset}.tar.gz.sha256")

          # A moved tag must never publish assets verified against a different commit.
          object="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object')"
          for depth in 1 2 3 4 5; do
            type="$(jq -r '.type' <<<"$object")"
            sha="$(jq -r '.sha' <<<"$object")"
            if [ "$type" = commit ]; then break; fi
            test "$type" = tag
            object="$(gh api "repos/${GH_REPO}/git/tags/${sha}" --jq '.object')"
          done
          test "$type" = commit
          test "$sha" = "$EXPECTED_COMMIT"

          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if existing="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$existing" != true ]; then
              echo "A published release already exists; refusing to overwrite it."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "HomeAgent ${RELEASE_TAG}" --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "HomeAgent ${RELEASE_TAG}" --notes-file release/RELEASE_NOTES.md "${flags[@]}"
          fi
          # Only a draft can be resumed/replaced after a failed upload.
          gh release upload "$RELEASE_TAG" \
            "release/${asset}.tar.gz" \
            "release/${asset}.tar.gz.sha256" \
            "release/${asset}.manifest.txt" \
            "release/${server_archive}" \
            "release/${server_archive}.sha256" \
            "release/${runner_archive}" \
            "release/${runner_archive}.sha256" \
            "release/npm-packages.json" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"

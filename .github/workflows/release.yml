name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.3.0 or v0.4.0-rc.1.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      package_name: ${{ steps.metadata.outputs.package_name }}
      npm_tag: ${{ steps.metadata.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Validate tag, commit, version and changelog
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-metadata.mjs

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
    permissions:
      contents: read

  package:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run notices:check
      - run: npm run release:check
      - run: npm run release:source
      - run: npm run release:npm
      - name: Generate version-specific release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release-metadata.mjs --notes
      - name: Verify archive checksum
        working-directory: release
        run: sha256sum --check *.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # Publish only the verified tarball. No checkout, npm install or lifecycle scripts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org/
      - name: Check verified npm artifact and immutable version
        id: npm
        env:
          EXPECTED_NAME: ${{ needs.prepare.outputs.package_name }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.npm_tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          metadata=release/npm-package.json
          test "$(jq -r '.name' "$metadata")" = "$EXPECTED_NAME"
          test "$(jq -r '.version' "$metadata")" = "$EXPECTED_VERSION"
          test "$(jq -r '.commit' "$metadata")" = "$EXPECTED_COMMIT"
          test "$(jq -r '.distTag' "$metadata")" = "$EXPECTED_TAG"
          archive="$(jq -r '.filename' "$metadata")"
          [[ "$archive" =~ ^[a-z0-9][a-z0-9._-]*\.tgz$ ]]
          (cd release && sha256sum --check "${archive}.sha256")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          object="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object')"
          for depth in 1 2 3 4 5; do
            type="$(jq -r '.type' <<<"$object")"
            sha="$(jq -r '.sha' <<<"$object")"
            if [ "$type" = commit ]; then break; fi
            test "$type" = tag
            object="$(gh api "repos/${GH_REPO}/git/tags/${sha}" --jq '.object')"
          done
          test "$type" = commit
          test "$sha" = "$EXPECTED_COMMIT"
          # A network/registry error is not proof that a version is available.
          status="$(curl -sS -o registry.json -w '%{http_code}' \
            "https://registry.npmjs.org/${EXPECTED_NAME}/${EXPECTED_VERSION}")"
          if [ "$status" = 200 ]; then
            test "$(jq -r '.dist.integrity' registry.json)" = "$(jq -r '.integrity' "$metadata")"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "The exact verified package already exists; resuming GitHub Release."
          else
            test "$status" = 404
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish public npm package with repository secret
        if: steps.npm.outputs.already_published != 'true' && vars.NPM_AUTH_MODE != 'oidc'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_ARCHIVE: ${{ steps.npm.outputs.archive }}
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Add the NPM_TOKEN Actions secret, or configure trusted publishing and NPM_AUTH_MODE=oidc."
            exit 1
          fi
          npm publish "./release/${NPM_ARCHIVE}" --ignore-scripts --access public \
            --tag "$NPM_TAG" --registry https://registry.npmjs.org/
      - name: Publish with npm trusted publishing
        if: steps.npm.outputs.already_published != 'true' && vars.NPM_AUTH_MODE == 'oidc'
        env:
          NPM_ARCHIVE: ${{ steps.npm.outputs.archive }}
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Remove setup-node's token configuration so npm can use GitHub OIDC.
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-oidc.npmrc"
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          unset NODE_AUTH_TOKEN
          npm publish "./release/${NPM_ARCHIVE}" --ignore-scripts --access public \
            --provenance --tag "$NPM_TAG" --registry https://registry.npmjs.org/

  publish:
    needs: [prepare, package, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      # No checkout, dependency installation or project code runs with the write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: release
      - name: Publish reviewed assets through a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          asset="HomeAgent-v${RELEASE_VERSION}-source"
          test -f "release/${asset}.tar.gz"
          test -f "release/${asset}.tar.gz.sha256"
          test -f "release/${asset}.manifest.txt"
          test -f release/RELEASE_NOTES.md
          npm_archive="$(jq -r '.filename' release/npm-package.json)"
          [[ "$npm_archive" =~ ^[a-z0-9][a-z0-9._-]*\.tgz$ ]]
          (cd release && sha256sum --check "${asset}.tar.gz.sha256")

          # A moved tag must never publish assets verified against a different commit.
          object="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object')"
          for depth in 1 2 3 4 5; do
            type="$(jq -r '.type' <<<"$object")"
            sha="$(jq -r '.sha' <<<"$object")"
            if [ "$type" = commit ]; then break; fi
            test "$type" = tag
            object="$(gh api "repos/${GH_REPO}/git/tags/${sha}" --jq '.object')"
          done
          test "$type" = commit
          test "$sha" = "$EXPECTED_COMMIT"

          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if existing="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$existing" != true ]; then
              echo "A published release already exists; refusing to overwrite it."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "HomeAgent ${RELEASE_TAG}" --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "HomeAgent ${RELEASE_TAG}" --notes-file release/RELEASE_NOTES.md "${flags[@]}"
          fi
          # Only a draft can be resumed/replaced after a failed upload.
          gh release upload "$RELEASE_TAG" \
            "release/${asset}.tar.gz" \
            "release/${asset}.tar.gz.sha256" \
            "release/${asset}.manifest.txt" \
            "release/${npm_archive}" \
            "release/${npm_archive}.sha256" \
            "release/npm-package.json" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"

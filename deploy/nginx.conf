# Inside the nginx http block:
map $http_upgrade $homeagent_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name mcp.example.com;
    ssl_certificate /etc/ssl/homeagent/fullchain.pem;
    ssl_certificate_key /etc/ssl/homeagent/privkey.pem;
    client_max_body_size 512k;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $homeagent_connection;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}
